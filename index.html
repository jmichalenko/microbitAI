<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro:bit Light Monitor</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7f2; color: #1f2a22; }
    main { max-width: 850px; margin: 0 auto; padding: 28px 16px; }
    h1 { font-size: 44px; margin: 0 0 8px; }
    p { color: #647067; font-size: 18px; }
    .panel { background: white; border: 1px solid #dfe7dc; border-radius: 8px; padding: 18px; }
    .metric { border: 1px solid #dfe7dc; border-radius: 8px; padding: 18px; margin-bottom: 14px; }
    .label { color: #647067; font-weight: bold; text-transform: uppercase; }
    #lightValue { font-size: 88px; font-weight: bold; margin: 30px 0; }
    progress { width: 100%; height: 14px; accent-color: #a46800; }
    button { border: 0; border-radius: 8px; background: #1f2a22; color: white; font-weight: bold; padding: 12px 16px; cursor: pointer; }
    button.secondary { background: #e7ece5; color: #1f2a22; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
    pre { background: #172018; color: #e7f3e9; padding: 12px; border-radius: 8px; min-height: 180px; white-space: pre-wrap; overflow: auto; }
    .warning { display: none; background: #fff4f2; border-left: 4px solid #b42318; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    .warning.show { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Micro:bit Light Monitor</h1>
    <p>Read the micro:bit light level over USB serial and save each reading to Google Sheets.</p>

    <div class="warning" id="serialWarning">
      This browser cannot access Web Serial. Use Chrome on the Chromebook and open this page over HTTPS.
    </div>

    <section class="panel">
      <div class="metric">
        <div class="label">Light Level</div>
        <div id="lightValue">--</div>
        <progress id="lightBar" max="255" value="0"></progress>
      </div>

      <div class="buttons">
        <button id="connectButton">Connect micro:bit</button>
        <button class="secondary" id="disconnectButton" disabled>Disconnect</button>
        <button class="secondary" id="setupButton">Set up sheet</button>
      </div>

      <pre id="log">Waiting for serial data...</pre>
    </section>
  </main>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzIJvOzlYbpCDoMbzCdcPGgq7gSGRAv8vblh3tjex_fpGjjzi81FyaoBqzOz-1Ln7zr/exec';

    const state = { port: null, reader: null, keepReading: false, buffer: '' };

    const els = {
      serialWarning: document.getElementById('serialWarning'),
      connectButton: document.getElementById('connectButton'),
      disconnectButton: document.getElementById('disconnectButton'),
      setupButton: document.getElementById('setupButton'),
      log: document.getElementById('log'),
      lightValue: document.getElementById('lightValue'),
      lightBar: document.getElementById('lightBar')
    };

    if (!('serial' in navigator)) {
      els.serialWarning.classList.add('show');
      els.connectButton.disabled = true;
    }

    els.connectButton.addEventListener('click', connectSerial);
    els.disconnectButton.addEventListener('click', disconnectSerial);
    els.setupButton.addEventListener('click', () => {
      sendToSheet({ setup: '1' });
      log('Setup request sent.');
    });

    async function connectSerial() {
      try {
        state.port = await navigator.serial.requestPort();
        await state.port.open({ baudRate: 115200 });
        state.keepReading = true;
        els.connectButton.disabled = true;
        els.disconnectButton.disabled = false;
        log('Connected to micro:bit.');
        readSerialLoop();
      } catch (error) {
        log('Connection failed: ' + error.message);
      }
    }

    async function readSerialLoop() {
      const decoder = new TextDecoder();

      while (state.port && state.keepReading) {
        try {
          state.reader = state.port.readable.getReader();

          while (state.keepReading) {
            const { value, done } = await state.reader.read();
            if (done) break;
            if (value) handleSerialText(decoder.decode(value, { stream: true }));
          }
        } catch (error) {
          log('Serial read error: ' + error.message);
        } finally {
          if (state.reader) {
            state.reader.releaseLock();
            state.reader = null;
          }
        }
      }
    }

    async function disconnectSerial() {
      state.keepReading = false;
      if (state.reader) await state.reader.cancel();
      if (state.port) await state.port.close();
      state.port = null;
      els.connectButton.disabled = false;
      els.disconnectButton.disabled = true;
      log('Disconnected.');
    }

    function handleSerialText(text) {
      state.buffer += text;
      const lines = state.buffer.split(/\r?\n/);
      state.buffer = lines.pop() || '';
      lines.map(line => line.trim()).filter(Boolean).forEach(handleSerialLine);
    }

    function handleSerialLine(line) {
      log(line);
      const reading = parseReading(line);

      if (!reading) {
        log('Could not parse reading.');
        return;
      }

      els.lightValue.textContent = reading.light;
      els.lightBar.value = Math.max(0, Math.min(255, reading.light));

      sendToSheet({
        light: reading.light,
        raw: reading.raw,
        source: 'hosted-web-serial'
      });

      log('Sent light level ' + reading.light);
    }

    function parseReading(line) {
      if (line.startsWith('{')) {
        try {
          const data = JSON.parse(line);
          return makeReading(data.light ?? data.lightLevel, line);
        } catch {
          return null;
        }
      }

      if (line.includes('=') || line.includes(':')) {
        const separator = line.includes('=') ? '=' : ':';
        const parts = line.split(separator);
        return makeReading(parts.slice(1).join(separator).trim(), line);
      }

      return makeReading(line, line);
    }

    function makeReading(value, raw) {
      const light = Number(value);
      if (!Number.isFinite(light)) return null;
      return { light, raw };
    }

    function sendToSheet(params) {
      const url = new URL(WEB_APP_URL);
      Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));

      const img = new Image();
      img.src = url.toString();
      img.style.display = 'none';
      document.body.appendChild(img);
      setTimeout(() => img.remove(), 10000);
    }

    function log(message) {
      const time = new Date().toLocaleTimeString();
      els.log.textContent = `${time}  ${message}\n${els.log.textContent}`;
    }
  </script>
</body>
</html>
